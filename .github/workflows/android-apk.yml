name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run focused regression tests
        run: >-
          ./gradlew --no-daemon -DskipFormatKtlint=true
          :app:testDebugUnitTest
          --tests org.schabi.newpipe.fragments.MainFragmentTest
          --tests org.schabi.newpipe.fragments.detail.VideoDetailFragmentTest
          --tests org.schabi.newpipe.local.feed.FeedInitialLoadGateTest
          --tests org.schabi.newpipe.player.ui.MiniPlayerStateTest
          --tests org.schabi.newpipe.player.ui.MiniPlayerMetadataTest
          --tests org.schabi.newpipe.player.ui.MiniPlayerLayoutPolicyTest
          --tests org.schabi.newpipe.player.ExclusivePlaybackCoordinatorTest
          --tests org.schabi.newpipe.player.ui.MiniPlayerDismissalTest
          --tests org.schabi.newpipe.fragments.detail.FullscreenLayoutPolicyTest
          --tests org.schabi.newpipe.fragments.list.recommendations.RecommendationGridPolicyTest
          --tests org.schabi.newpipe.download.DownloadLinkInputTest
          --tests us.shandian.giga.service.DownloadProgressCalculatorTest
          --tests us.shandian.giga.service.DownloadProgressSnapshotTest
          --tests us.shandian.giga.ui.adapter.MissionAdapterTest
          -x :app:runKtlint

      - name: Build debug APK
        run: >-
          ./gradlew --no-daemon -DskipFormatKtlint=true
          assembleDebug assembleDebugAndroidTest
          -x :app:runKtlint

      - name: Run Android regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: >-
            ./gradlew --no-daemon -DskipFormatKtlint=true
            :app:connectedDebugAndroidTest
            -x :app:runKtlint
        env:
          ANDROID_I_WANT_MY_TCG: yes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: YmnTube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-connected-test-results
          path: app/build/reports/androidTests/connected/debug/
          if-no-files-found: warn
          retention-days: 14
